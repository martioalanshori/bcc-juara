<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#181b1f" />
  <title>Check-in Gate · Summarecon Mall Bandung</title>
  <script src="/app/js/core/theme.js?v=26"></script>
  <link rel="stylesheet" href="/app/vendor/fonts/fonts.css?v=4" />
  <link rel="stylesheet" href="/app/vendor/tailwind.css?v=26" />
  <link rel="stylesheet" href="/app/css/app.css?v=26" />
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
  <header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2"><span class="w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center text-primary"><span class="material-symbols-outlined text-[18px]">qr_code_scanner</span></span>
        <span class="flex flex-col leading-tight"><span class="font-headline-sm text-headline-sm">Check-in Gate</span><span class="font-label-sm text-label-sm text-secondary">Panitia · Summarecon Mall</span></span></div>
      <div class="flex items-center gap-2"><span id="mode" class="font-label-sm text-label-sm px-2 py-1 rounded-md bg-surface-container-high text-on-surface-variant"></span><button type="button" class="theme-btn" data-theme-toggle aria-label="Ganti mode tampilan"><span class="material-symbols-outlined">dark_mode</span></button><button type="button" data-logout="pengelola" hidden class="flex items-center gap-1 px-2 py-1.5 rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-white/5" title="Keluar dari sesi PIN"><span class="material-symbols-outlined text-[18px]">logout</span><span class="hidden sm:inline">Keluar</span></button></div>
    </div>
  </header>
  <main id="app" class="max-w-xl mx-auto px-4 pt-4 pb-10"></main>
  <div id="modal-root"></div>

  <script src="/app/vendor/qrcode.js?v=26"></script>
  <script src="/app/vendor/jsQR.js?v=26"></script>
  <script src="/app/js/core/auth.js?v=26"></script>
  <script src="/app/js/event/engine.js?v=26"></script>
  <script src="/app/js/event/checkin-ui.js?v=26"></script>
  <script>
    (function () {
      const E = window.Evt, C = window.EvtCheckin, esc = E.esc;
      const app = document.getElementById('app');
      let evId = null, gate = null;
      function stats() {
        const s = E.stats(evId), e = E.ev(evId);
        const anom = C.anomalies(evId).filter((a) => a.gate === gate);
        return `${anom.length ? `<div class="card crit-left p-4 mb-3 flex flex-col gap-2"><b class="text-rose-300">${anom[0].n} pindaian gagal/duplikat dalam 10 menit di gate ini</b><span class="font-body-sm text-body-sm text-on-surface-variant">Kemungkinan ada tiket palsu atau calo. Laporkan agar Command Center membuat tiket insiden dan mengirim regu keamanan.</span><button class="btn-danger justify-center" id="report">Laporkan ke Command Center</button></div>` : ''}
          <div class="grid grid-cols-3 gap-2 mb-3"><div class="card p-3 text-center"><div class="lbl">Hadir</div><div class="font-headline-md text-headline-md text-emerald-300">${s.checkedIn}</div></div><div class="card p-3 text-center"><div class="lbl">Tiket</div><div class="font-headline-md text-headline-md">${s.tickets}</div></div><div class="card p-3 text-center"><div class="lbl">Belum</div><div class="font-headline-md text-headline-md">${s.tickets - s.checkedIn}</div></div></div>`;
      }
      function render() {
        const evs = E.s.order.map(E.ev).filter((e) => e.status !== 'DRAFT' && e.status !== 'CANCELLED').sort((a, b) => Math.abs(a.start - E.now()) - Math.abs(b.start - E.now()));
        if (!evs.length) { app.innerHTML = '<section class="card p-6 text-center text-on-surface-variant">Belum ada acara aktif untuk check-in.</section>'; return; }
        evId = evId && E.ev(evId) ? evId : evs[0].id;
        const e = E.ev(evId);
        gate = e.gates.includes(gate) ? gate : e.gates[0];
        app.innerHTML = E.modeBanner() + `<div class="grid grid-cols-1 gap-3 mb-3"><label class="f">Acara<select class="inp" id="ev">${evs.map((x) => `<option value="${x.id}" ${x.id === evId ? 'selected' : ''}>${esc(x.name)} · ${E.fmtShort(x.start)}</option>`).join('')}</select></label>
          <label class="f">Gate<select class="inp" id="gate">${e.gates.map((g) => `<option ${g === gate ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label></div>
          <div id="stats">${stats()}</div>
          <section class="card p-4 mb-3">${C.panel({ compact: true })}</section>
          <section class="card p-4"><h2 class="font-headline-sm text-headline-sm mb-2">Pindaian terakhir</h2><div id="log" class="overflow-x-auto">${C.logTable(evId, 12)}</div></section>`;
        app.querySelector('#ev').addEventListener('change', (x) => { C.stopCam(); evId = x.target.value; render(); });
        app.querySelector('#gate').addEventListener('change', (x) => { gate = x.target.value; refresh(); });
        C.mount(app, () => evId, () => gate);
        bindReport();
      }
      function bindReport() {
        const r = app.querySelector('#report');
        if (r) r.addEventListener('click', async () => { r.disabled = true; await E.report(evId, gate, 'Petugas gate melaporkan pindaian QR gagal/duplikat berulang (indikasi tiket palsu/calo).'); r.textContent = 'Terkirim ke Command Center'; });
      }
      function refresh() { if (!app.querySelector('#stats')) return render(); if (!E.ev(evId) || E.ev(evId).status === 'CANCELLED') return render(); app.querySelector('#stats').innerHTML = stats(); app.querySelector('#log').innerHTML = C.logTable(evId, 12); bindReport(); }
      E.init().then(() => {
        document.getElementById('mode').innerHTML = E.mode === 'server' ? '<span class="text-emerald-300">●</span> LAN' : '<span class="text-amber-300">●</span> Lokal';
        render();
        let t = null; E.subscribe(() => { clearTimeout(t); t = setTimeout(refresh, 100); });
      });
    })();
  </script>
</body>
</html>
