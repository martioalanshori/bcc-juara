<!DOCTYPE html>
<html lang="id" data-base="/command-center">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summarecon Mall · Integrated Command Center Ticketing System</title>
  <!-- Semua aset lokal (tanpa internet): font di vendor/fonts, Tailwind hasil build statis.
       Tema "Papan Petunjuk": token di css/tokens.css, build di tools/tailwind/tailwind.config.js -->
  <script src="/app/js/core/theme.js?v=107"></script>
  <script src="/app/js/core/router.js?v=107"></script>
  <link rel="stylesheet" href="/app/vendor/fonts/fonts.css?v=5" />
  <link rel="stylesheet" href="/app/vendor/tailwind.css?v=107" />
  <link rel="stylesheet" href="/app/css/app.css?v=107" />
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
  <a href="#view" class="pg-skip">Lewati ke konten</a>
  <!-- SIDEBAR: tetap di layar lebar, menjadi laci (drawer) di bawah 1024 px (AUDIT C1) -->
  <aside id="sidebar" class="cc-side" aria-label="Navigasi Command Center">
    <div class="flex flex-col gap-5 min-h-0">
      <div class="px-5 flex items-center justify-between gap-2">
        <a href="/command-center/ticketing" class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-lg bg-surface-container-high flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-primary text-[20px]">hub</span></div>
          <div class="flex flex-col min-w-0"><span class="font-headline-sm text-headline-sm text-on-surface leading-tight">Command Center</span><span class="font-label-sm text-label-sm text-on-surface-variant">Summarecon Mall Bandung</span></div>
        </a>
        <button type="button" class="cc-icon-btn cc-drawer-x" id="cc-close" aria-label="Tutup menu"><span class="material-symbols-outlined">close</span></button>
      </div>
      <nav id="nav" class="flex flex-col gap-1 px-3 overflow-y-auto"></nav>
    </div>
    <div class="px-5 pt-3 flex items-center justify-between text-on-surface-variant">
      <span class="font-label-sm text-label-sm">Build 4.19.0-SMB</span>
      <button id="btn-reset" class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface" title="Kembalikan data demo ke kondisi awal">Reset demo</button>
    </div>
  </aside>
  <div class="cc-scrim scrim" id="cc-scrim" hidden></div>

  <div class="cc-main">
    <!-- HEADER: judul halaman di kiri; satu aksi sekunder (siaran) + profil di kanan -->
    <header class="cc-top">
      <button type="button" class="cc-icon-btn cc-menu-btn" id="cc-menu" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false"><span class="material-symbols-outlined">menu</span></button>
      <div class="flex items-center gap-4 min-w-0 flex-1">
        <div class="flex flex-col leading-tight min-w-0"><span class="font-label-sm text-label-sm text-on-surface-variant whitespace-nowrap cc-top-kick">Command Center</span><h1 class="font-headline-sm text-headline-sm text-on-surface truncate" id="hdr-title">Memuat…</h1></div>
        <div class="cc-shift-chip" title="Shift jaga saat ini"><span class="w-1.5 h-1.5 rounded-full bg-secondary"></span><span class="font-label-sm text-label-sm text-on-surface" id="shift">Shift A</span><span class="font-label-sm text-label-sm text-on-surface-variant">Fasilitas &amp; Keamanan</span></div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <div class="cc-hstats">
          <a href="/command-center/ticketing"><span>Tiket aktif</span><b id="hdr-active">0</b></a>
          <a href="/command-center/owner360"><span>Okupansi mal</span><b>94,2%</b></a>
          <a href="/command-center/bms"><span>Kesehatan sistem</span><b id="hdr-health">99,8%</b></a>
        </div>
        <button id="btn-broadcast" class="btn-danger cc-bc-btn whitespace-nowrap" title="Kirim broadcast ke tenant &amp; personel"><span class="material-symbols-outlined text-[18px]">campaign</span><span class="cc-bc-t">Kirim Broadcast</span></button>
        <span class="id-chip" id="cc-id-chip" hidden></span>
        <button type="button" class="theme-btn" data-theme-toggle aria-label="Ganti mode tampilan"><span class="material-symbols-outlined">dark_mode</span></button>
        <!-- profil operator: satu tombol, Keluar ada di dalam menu -->
        <div class="pg-prof" id="cc-prof">
          <button type="button" class="pg-prof-btn" id="cc-prof-btn" aria-haspopup="true" aria-expanded="false" aria-controls="cc-prof-menu" aria-label="Menu profil Aris Thorne"><span class="pg-av" data-cc-av>AT</span><span class="cc-prof-txt"><b data-cc-name>Aris Thorne</b><small data-cc-title>Kepala operasional (L4)</small></span><span class="material-symbols-outlined text-[18px] pg-prof-chev">expand_more</span></button>
          <div class="pg-prof-menu" id="cc-prof-menu" hidden>
            <div class="pg-prof-head"><b data-cc-name>Aris Thorne</b><small><span data-cc-title>Kepala operasional (L4)</span>, cc@example.com</small><span class="cc-shift"><i></i><span>Jaga <span id="shift-menu">Shift A</span>, Fasilitas &amp; Keamanan</span></span></div>
            <button type="button" id="cc-prof-edit" class="cc-prof-item w-full text-left"><span class="material-symbols-outlined text-[20px]">manage_accounts</span>Edit profil</button>
            <div class="pg-sw" data-demo-switch hidden></div>
            <button type="button" data-logout="command-center divisi-event divisi-ops" hidden><span class="material-symbols-outlined text-[20px]">logout</span>Keluar</button>
          </div>
        </div>
      </div>
    </header>

    <main class="cc-content" id="cc-content">
      <div id="ticker" class="cc-ticker"></div>
      <div id="park-alarm" class="cc-park-alarm"></div>
      <div id="view" tabindex="-1"></div>
    </main>
  </div>
  <nav class="cc-bnav" id="cc-bnav" aria-label="Navigasi cepat"></nav>

  <div id="sim-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-6 right-6 z-[90] flex flex-col gap-2 items-end"></div>

  <script src="/app/vendor/qrcode.js?v=107"></script>
  <script src="/app/vendor/jsQR.js?v=107"></script>
  <script src="/app/js/command-center/sop-data.js?v=107"></script>
  <script src="/app/js/command-center/data.js?v=107"></script>
  <script src="/app/js/command-center/store.js?v=107"></script>
  <script src="/app/js/core/ui.js?v=107"></script>
  <script src="/app/js/core/pdf.js?v=107"></script>
  <script src="/app/js/command-center/views/ticketing.js?v=107"></script>
  <script src="/app/js/command-center/views/bms.js?v=107"></script>
  <script src="/app/js/command-center/views/tenant.js?v=107"></script>
  <script src="/app/js/command-center/views/cctv.js?v=107"></script>
  <script src="/app/js/command-center/views/energy.js?v=107"></script>
  <script src="/app/js/command-center/views/analytics.js?v=107"></script>
  <script src="/app/js/command-center/views/parking.js?v=107"></script>
  <script src="/app/js/command-center/views/owner360.js?v=107"></script>
  <script src="/app/js/command-center/sentimen-data.js?v=107"></script>
  <script src="/app/js/command-center/views/sentimen.js?v=107"></script>
  <script src="/app/js/event/engine.js?v=107"></script>
  <script src="/app/js/event/approval-ui.js?v=107"></script>
  <script src="/app/js/event/checkin-ui.js?v=107"></script>
  <script src="/app/js/event/admin.js?v=107"></script>
  <script src="/app/js/event/cc-bridge.js?v=107"></script>
  <script src="/app/js/command-center/views/approval.js?v=107"></script>
  <script src="/app/js/command-center/views/sop.js?v=107"></script>
  <script src="/app/js/command-center/views/usecase.js?v=107"></script>
  <script src="/app/js/command-center/sim.js?v=107"></script>
  <script src="/app/js/core/auth.js?v=107"></script>
  <script src="/app/js/command-center/live.js?v=107"></script>
  <script src="/app/js/command-center/app.js?v=107"></script>
</body>
</html>
